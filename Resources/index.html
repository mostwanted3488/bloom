  let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;

    let bin = '';
    for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    JB.emitEvent('sample_data', { name: file.name, b64: btoa(bin) });
  };
  delete SELECTS.metro;                               // le métronome est celui du DAW
  ST.midiout = 1;
  SELECTS.midiout = { label:'MIDI', col:'R', y:556, items: () => ['OUT','OFF'], get: () => ST.midiout ? 0 : 1,
                      set: i => { ST.midiout = i === 0 ? 1 : 0; toast = { a: 'MIDI', b: ST.midiout ? 'OUT → RECORDABLE' : 'OFF', t: nowS() }; } };

  let hostTempo = false, lastSnap = '';
  const snapState = () => {
    const o = { ...KV, bloom, sound: sndIdx, layer: ST.layer + 1, key: ST.root, scale: ST.scale, snap: ST.snap,
                delay: DELAYS.indexOf(ST.delay), quant: QUANTS.indexOf(ST.quant), arp: ARPS.indexOf(ST.arp),
                rate: RATES.indexOf(ST.rate), hover: ST.hover, flower: spIdx, color: vIdx, preset: presetIdx, midiout: ST.midiout };
    if (!hostTempo) o.bpm = ST.bpm;
    return o;
  };
  setInterval(() => {                                  // interface → paramètres du plugin (automatisables)
    const o = snapState(), str = JSON.stringify(o);
    if (str !== lastSnap) { lastSnap = str; JB.emitEvent('params', o); }
  }, 50);
  JB.addEventListener('params', p => {                 // automation / chargement de projet → interface
    for (const k of KNOBS) if (p[k.id] !== undefined) KV[k.id] = +p[k.id];
    if (p.bloom !== undefined) bloom = +p.bloom;
    if (p.sound !== undefined && (p.sound | 0) < SOUNDS.length) sndIdx = p.sound | 0;
    if (p.layer !== undefined && (p.layer | 0) - 1 < SOUNDS.length) ST.layer = (p.layer | 0) - 1;
    if (p.key !== undefined) ST.root = p.key | 0;
    if (p.scale !== undefined) ST.scale = p.scale | 0;
    if (p.snap !== undefined) ST.snap = p.snap > .5 ? 1 : 0;
    if (p.delay !== undefined && DELAYS[p.delay | 0]) ST.delay = DELAYS[p.delay | 0];
    if (p.quant !== undefined && QUANTS[p.quant | 0]) ST.quant = QUANTS[p.quant | 0];
    if (p.arp !== undefined && ARPS[p.arp | 0]) ST.arp = ARPS[p.arp | 0];
    if (p.rate !== undefined && RATES[p.rate | 0]) ST.rate = RATES[p.rate | 0];
    if (p.hover !== undefined) ST.hover = p.hover > .5 ? 1 : 0;
    if (p.midiout !== undefined) ST.midiout = p.midiout > .5 ? 1 : 0;
    if (p.flower !== undefined && (p.flower | 0) !== spIdx) setSpecies(p.flower | 0);
    if (p.color !== undefined) vIdx = p.color | 0;
    if (p.preset !== undefined) presetIdx = p.preset | 0;
    if (!hostTempo && p.bpm !== undefined) ST.bpm = Math.round(p.bpm);
    lastSnap = JSON.stringify(snapState());
  });
  JB.addEventListener('note_vis', n => noteVisual(n.midi | 0, +n.vel));   // notes du piano roll / arp / clavier
  JB.addEventListener('host', h => {
    hostTempo = h.bpm > 0;
    hostRec = !!h.recording;
    if (hostTempo) ST.bpm = Math.round(h.bpm * 10) / 10;
    voices.length = h.voices | 0;
  });
  JB.addEventListener('sample_loaded', s => {
    const P = { name: s.name, user: true, cat: 'SAMPLE', p: [] };
    const i = SOUNDS.findIndex(x => x.user);
    if (i >= 0) SOUNDS[i] = P; else SOUNDS.push(P);
    if (wantSample) { wantSample = false; sndIdx = SOUNDS.indexOf(P); toast = { a: 'SOUND', b: P.name, t: nowS() }; previewSound(); }
  });
  JB.emitEvent('ready', {});
}

// accès pour tests
window.__iris = { setSpecies, setSound, setVariant, openMenu, ST, KV, keyDown, keyUp, setSustain, voices: () => voices.length,
                  A, ac: () => AC, applyPreset, loadSample, playNote, chordAt, nP: () => PRESETS.length, nS: () => SOUNDS.length, setBloom: v => { bloom = v; onParam(); },
                  skip: () => { t0 = nowS() - 30; } };
requestAnimationFrame(frame);
})();
</script>
